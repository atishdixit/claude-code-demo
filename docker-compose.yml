services:
  mysql:
    image: mysql:8.4
    container_name: log-monitor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authdb
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    container_name: log-monitor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-topic-init:
    image: apache/kafka:3.8.0
    container_name: log-monitor-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic app-logs --partitions 3 --replication-factor 1"
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: log-monitor-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: log-monitor
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  auth-service:
    build: ./auth-service
    container_name: log-monitor-auth-service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: authdb
      DB_USER: root
      DB_PASSWORD: root
      JWT_EXPIRATION_SECONDS: 3600

  log-ingestion-service:
    build: ./log-ingestion-service
    container_name: log-monitor-log-ingestion-service
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_LOGS_TOPIC: app-logs

  log-processing-service:
    build: ./log-processing-service
    container_name: log-monitor-log-processing-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: processingdb
      DB_USER: root
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: log-processors
      APP_LOGS_TOPIC: app-logs

  alert-service:
    build: ./alert-service
    container_name: log-monitor-alert-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: alertdb
      DB_USER: root
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: alert-processors
      APP_LOGS_TOPIC: app-logs
